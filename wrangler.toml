# Cloudflare Pages project config for direct (token) deploys and local dev.
# Git-connected deploys do not need this file; it exists so that
# `wrangler pages deploy` and `wrangler pages dev` work without extra flags.
#
# Account: 57c0ba39df3ac549e86fc62434509438 (Brett's Cloudflare account).
# Deploys read CLOUDFLARE_API_TOKEN from the environment; the token is never
# committed. See README "Deploying".

name = "alliance-mutual-escrow"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# Reviews cache (Phase 3). The /api/reviews Function reads this namespace; the
# section renders nothing until GOOGLE_PLACES_KEY is also set (a secret, set via
# `wrangler pages secret put GOOGLE_PLACES_KEY` or the dashboard, never here).
[[kv_namespaces]]
binding = "REVIEWS"
id = "3996bc8c9cc64eb491fc6712154cfc2c"

[vars]
# Public identifier for the Tustin office on Google Maps (verified round-trip:
# resolves to "Alliance Mutual Escrow, Inc.", 12681 Newport Ave).
GOOGLE_PLACE_ID = "ChIJ32vwBbjb3IARki5f0Aft9M8"
# Email: Resend is selected but stays inert until the RESEND_API_KEY secret is
# set on the project. EMAIL_FROM requires the domain verified in Resend; the
# function falls back to Resend's onboarding sender until then.
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "Alliance Mutual Escrow <estimates@ameescrow.com>"
INQUIRY_TO = "info@ameescrow.com"
# Internal notification list (comma-separated). Per IT: the site emails the
# team directly on every inquiry/estimate; no distribution list needed.
# Update with Laura / Mike / Ryan once Ryan confirms addresses.
NOTIFY_TO = "info@ameescrow.com"
